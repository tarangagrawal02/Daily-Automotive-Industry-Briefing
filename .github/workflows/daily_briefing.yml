name: Daily Automotive Briefing

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC = 08:00 IST
  workflow_dispatch:     # Manual trigger for testing

concurrency:
  group: "newsletter-run"
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Required to push the DB back to the repo
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SENDER: 'onboarding@resend.dev'
        run: python main.py

      - name: Commit Updated SQLite DB
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update automotive history database"
          file_pattern: "storage/history.db"
